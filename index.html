<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
        background-color: #d97cbd89;
      }

      .omikuji-result {
        width: 250px;
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 5px solid purple;
        border-radius: 50px;
      }

      .omikuji-controls button {
        margin-right: 8px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
      }

      .omikuji-result.大吉 {
        color: red;
      }

      .omikuji-result.中吉 {
        color: orange;
      }

      .omikuji-result.吉 {
        color: green;
      }

      .omikuji-result.小吉 {
        color: blue;
      }

      .omikuji-result.末吉 {
        color: purple;
      }

      .omikuji-result.凶 {
        background-color: black;
        animation: darken 3s;
        color: white;
      }

      @keyframes darken {
        0% {
          opacity: 0.3;
        }

        100% {
          opacity: 1;
        }
      }

      .omikuji-result.大吉 {
        background-color: gold;
        color: red;
        animation: brighten 3s;
      }

      @keyframes brighten {
        0% {
          opacity: 0.3;
        }
        100% {
          opacity: 1;
        }
      }

      /* 残り枚数の見た目 */
      .omikuji-remaining {
        margin-top: 16px;
        font-size: 20px;
        font-weight: bold;
        color: purple;
      }
    </style>
  </head>

  <body>
    <h1>🔮今日の運勢🔮</h1>
    <p>今日のあなたの運勢は・・・</p>
    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <button id="draw-button">ここをクリック</button>
      <button id="reset-button">リセット</button>
    </div>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">運勢は・・・</div>

    <p>今日も笑顔溢れる素敵な1日になりますように✨</p>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->
    <div id="remaining" class="omikuji-remaining"></div>
    <ul id="history" class="omikuji-history"></ul>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
